<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
.b{width:600px;height:300px;position:relative;overflow:hidden}
.b::after{content:"";position:absolute;right:-60px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.16)}
.b::before{content:"";position:absolute;left:-50px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:rgba(0,0,0,.12)}
.c1{background:linear-gradient(135deg,#7C3AED 0%,#C026D3 55%,#EC4899 100%)}
.c2{background:linear-gradient(135deg,#1D4ED8 0%,#0891B2 60%,#22D3EE 100%)}
.c3{background:linear-gradient(135deg,#EA580C 0%,#F59E0B 60%,#FBBF24 100%)}
.c4{background:linear-gradient(135deg,#047857 0%,#0D9488 60%,#2DD4BF 100%)}
</style></head><body>
<div class="b c1"></div><div class="b c2"></div><div class="b c3"></div><div class="b c4"></div>
</body></html>
