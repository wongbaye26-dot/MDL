  .b{position:absolute;right:-140px;top:-120px;width:480px;height:480px;border-radius:50%;

  .c{position:absolute;left:0;right:0;bottom:0;height:140px;
     background:linear-gradient(to bottom,rgba(18,18,28,0),rgba(18,18,28,0.92));}

<body><div class="g"><div class="a"></div><div class="b"></div><div class="c"></div></div></body></html>
