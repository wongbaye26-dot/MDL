// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // buildTools 保持本机已验证可构建的 35.0.0：apk 打包用的 zipalign/apksigner 与新版本差异不大，
        // 真正决定 compileSdk 36 资源编译的是 AGP 自带 aapt2。本机另有 36.1.0/37.0.0，
        // 若后续 AGP 升级需要可再切到 36.1.0。
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        // Android 16（API 36）为目标版本：强制 edge-to-edge，见 doc/android-16-compat.md
        targetSdkVersion = 36

        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24" // Or any version above 1.3.x
        RNNKotlinVersion = kotlinVersion

        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.1')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}
