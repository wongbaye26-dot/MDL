// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // buildTools 保持本机已验证可构建的 35.0.0：apk 打包用的 zipalign/apksigner 与新版本差异不大，
        // 真正决定 compileSdk 36 资源编译的是 AGP 自带 aapt2。本机另有 36.1.0/37.0.0，
        // 若后续 AGP 升级需要可再切到 36.1.0。
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        // Android 16（API 36）为目标版本：强制 edge-to-edge，见 doc/android-16-compat.md
        targetSdkVersion = 36

        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.25" // RN 0.76.9 官方模板版本（RNGP 提供）
        RNNKotlinVersion = kotlinVersion

        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // RN 0.76 模板：不写版本号，AGP / Kotlin / RN Gradle Plugin 的版本由
        // @react-native/gradle-plugin（settings.gradle 的 includeBuild）统一提供。
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// RN 0.76 模板写法：rootproject 插件在 buildscript classpath 就绪后再 apply。
apply plugin: "com.facebook.react.rootproject"
