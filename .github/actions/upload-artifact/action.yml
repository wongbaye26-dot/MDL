name: Setup
description: Setup Env

runs:
  using: composite
  steps:
    # 项目只产出 arm64-v8a / armeabi-v7a 两个真机 ABI（+ universal），
    # 不再上传 x86/x86_64（gradle.properties 已过滤，那两个 APK 根本不会生成）。
    - name: Upload Artifact arm64-v8a
      if: env.PACKAGE_TYPE != 'Android_5'
      uses: actions/upload-artifact@v4
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-arm64-v8a-release
        path: android/app/build/outputs/apk/release/em-music-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk

    - name: Upload Artifact armeabi-v7a
      if: env.PACKAGE_TYPE == null
      uses: actions/upload-artifact@v4
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-armeabi-v7a-release
        path: android/app/build/outputs/apk/release/em-music-v${{ env.PACKAGE_VERSION }}-armeabi-v7a.apk

    - name: Upload Artifact universal
      if: env.PACKAGE_TYPE != 'Android_SL'
      uses: actions/upload-artifact@v4
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-universal-release
        path: android/app/build/outputs/apk/release/em-music-v${{ env.PACKAGE_VERSION }}-universal.apk
