name: Setup
description: Setup Env

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Setup Java Env
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        cache: gradle

    - name: Get npm cache directory
      id: npm-cache-dir
      shell: bash
      run: echo "cachedir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v4
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ${{ steps.npm-cache-dir.outputs.cachedir }}
        key: ${{ runner.os }}-npm-cache-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-cache-

    # 4 个原生依赖是 file:../vendor/*（仓库外的 fork），必须在 npm 安装之前拉下来，
    # 否则 npm 直接报 ENOENT。以前这一步只在 check.yml 里，导致 Build/Beta 工作流
    # 在干净 runner 上必挂在 Setup Env（2026-11-04 的 CI 失败即此原因）。
    - name: Fetch vendored native deps
      shell: bash
      run: node scripts/setup-vendor.js

    # 仓库根 .npmrc 有 install-links=true：RN 0.76 的 Metro 不跟随指向仓库外的软链，
    # file: 依赖必须物化成真实目录，否则 release 打 JS bundle 时解析不到。
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
