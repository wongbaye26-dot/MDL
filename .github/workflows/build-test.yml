name: Run build test

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      # vendor fork 在仓库外，必须先在 npm 安装前拉取；同时统一 Node/Java/缓存配置
      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Eslint check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Test Build
        run: npm run build-test
