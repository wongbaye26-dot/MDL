name: Check

# 提交/PR 上跑的静态检查。
#
# 注意：这个仓库有 4 个原生依赖指向仓库**外面**的 ../vendor，
# 所以必须先把它们拉下来（scripts/setup-vendor.js），否则 npm 直接失败。
# 这一步已收敛到 .github/actions/setup，避免各工作流重复/漏配。

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node / Java / npm 缓存 + 拉取 vendor + npm ci（.npmrc 已开启 install-links）
      - name: Setup Env
        uses: ./.github/actions/setup

      # postinstall 会跑 dependencies-patch.js；再显式校验一遍补丁有没有打上
      - name: Verify vendor patches
        run: npm run vendor:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
