name: Build

# 推 master 时：
#  - 仓库配置了签名 Secrets（KEYSTORE_*）→ 出 release 包、打 tag、发 GitHub Release；
#  - 没配置（fork / 首次接入）→ 只做 debug 编译校验，不发布，避免 CI 永远红。
on:
  push:
    branches:
      - master

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 != '' }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      # Node / Java / npm 缓存 + 拉取 ../vendor + npm ci（.npmrc install-links）
      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Release APK
        if: env.HAS_KEYSTORE == 'true'
        shell: bash
        run: |
          cd android
          echo ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }} | base64 --decode > app/${{ secrets.KEYSTORE_STORE_FILE }}
          ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE='${{ secrets.KEYSTORE_STORE_FILE }}' -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.KEYSTORE_KEY_ALIAS }}' -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.KEYSTORE_KEY_PASSWORD }}'
          rm -f app/${{ secrets.KEYSTORE_STORE_FILE }}

      # 没配签名 Secrets 时仍走 assembleRelease（app/build.gradle 会退回 debug 签名），
      # 校验完整 release 链路：Metro bundle + 原生库编译 + R8。产物不发布、禁止分发。
      - name: Build Release APK (no signing secrets, debug-signed)
        if: env.HAS_KEYSTORE != 'true'
        shell: bash
        run: cd android && ./gradlew assembleRelease --console=plain

      - name: Get package version
        if: env.HAS_KEYSTORE == 'true'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      # package.json 版本对应的 tag 不存在时才创建
      - name: Create git tag
        if: env.HAS_KEYSTORE == 'true'
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"

      - name: Generate file MD5
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      # App 内「检查更新」读取的是 GitHub Release 资产，文件名必须是
      # em-music-vX-{abi}.apk（见 src/utils/version.js 的 downloadNewVersion）。
      - name: Create GitHub Release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: v${{ env.PACKAGE_VERSION }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/em-music-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk
            android/app/build/outputs/apk/release/em-music-v${{ env.PACKAGE_VERSION }}-armeabi-v7a.apk
            android/app/build/outputs/apk/release/em-music-v${{ env.PACKAGE_VERSION }}-universal.apk

      - name: Upload Artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
